{{- $repoURL := .Values.global.repoURL -}}
{{- $targetRevision := .Values.global.targetRevision -}}
{{- $apps := list
  (dict "name" "base" "path" "gitops/base" "namespace" "argocd" "wave" "0")
  (dict "name" "aws-load-balancer-controller" "path" "gitops/apps/aws-load-balancer-controller" "namespace" "kube-system" "wave" "1")
  (dict "name" "external-dns" "path" "gitops/apps/external-dns" "namespace" "kube-system" "wave" "1")
  (dict "name" "sealed-secrets" "path" "gitops/apps/sealed-secrets" "namespace" "sealed-secrets" "wave" "1")
  (dict "name" "cloudnative-pg" "path" "gitops/apps/cloudnative-pg" "namespace" "cnpg-system" "wave" "1")
  (dict "name" "velero" "path" "gitops/apps/velero" "namespace" "velero" "wave" "1")
  (dict "name" "argocd" "path" "gitops/apps/argocd" "namespace" "argocd" "wave" "2")
  (dict "name" "karpenter" "path" "gitops/apps/karpenter" "namespace" "karpenter" "wave" "1")
  (dict "name" "kube-prometheus-stack" "path" "gitops/apps/kube-prometheus-stack" "namespace" "monitoring" "wave" "2")
  (dict "name" "karpenter-resources" "path" "gitops/apps/karpenter-resources/chart" "namespace" "karpenter" "wave" "3")
  (dict "name" "airflow-db" "path" "gitops/apps/airflow-db" "namespace" "airflow" "wave" "3")
  (dict "name" "loki" "path" "gitops/apps/loki" "namespace" "monitoring" "wave" "3")
  (dict "name" "alloy" "path" "gitops/apps/alloy" "namespace" "monitoring" "wave" "3")
  (dict "name" "airflow" "path" "gitops/apps/airflow" "namespace" "airflow" "wave" "4")
  (dict "name" "spark-operator" "path" "gitops/apps/spark-operator" "namespace" "spark-operator" "wave" "4")
  (dict "name" "kubecost" "path" "gitops/apps/kubecost" "namespace" "kubecost" "wave" "4")
  (dict "name" "otel-collector" "path" "gitops/apps/otel-collector" "namespace" "monitoring" "wave" "4")
-}}
{{- range $app := $apps }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $app.name }}
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: {{ $app.wave | quote }}
spec:
  project: default
  source:
    repoURL: {{ $repoURL | quote }}
    targetRevision: {{ $targetRevision | quote }}
    path: {{ $app.path | quote }}
    helm:
      values: |
        global:
{{ toYaml $.Values.global | indent 10 }}
{{ if eq $app.name "aws-load-balancer-controller" }}
        aws-load-balancer-controller:
          clusterName: {{ $.Values.global.clusterName | quote }}
          region: {{ $.Values.global.awsRegion | quote }}
          vpcId: {{ $.Values.global.vpcId | quote }}
          serviceAccount:
            create: false
            name: aws-load-balancer-controller
{{ else if eq $app.name "external-dns" }}
        external-dns:
          provider:
            name: aws
          serviceAccount:
            create: false
            name: external-dns
          policy: upsert-only
          registry: txt
          txtOwnerId: {{ $.Values.global.clusterName | quote }}
          domainFilters:
            - {{ $.Values.global.domain | quote }}
          extraArgs:
            aws-zone-type: public
{{ else if eq $app.name "karpenter" }}
        karpenter:
          settings:
            clusterName: {{ $.Values.global.clusterName | quote }}
            interruptionQueue: {{ $.Values.global.karpenterQueueName | quote }}
{{ else if eq $app.name "karpenter-resources" }}
        clusterName: {{ $.Values.global.clusterName | quote }}
        nodeRoleName: {{ $.Values.global.karpenterNodeRoleName | quote }}
        sparkNodeLabels:
          workload: spark
{{ else if eq $app.name "spark-operator" }}
        spark-operator:
          spark:
            jobNamespaces:
              - {{ $.Values.global.sparkWorkloadNamespace | quote }}
{{ else if eq $app.name "airflow" }}
        airflow:
          createUserJob:
            env:
              - name: AIRFLOW_ADMIN_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: airflow-admin-credentials
                    key: admin-password
            args:
              - "bash"
              - "-c"
              - 'exec airflow users create "$@"'
              - "--"
              - "-r"
              - "Admin"
              - "-u"
              - "admin"
              - "-e"
              - "admin@example.com"
              - "-f"
              - "admin"
              - "-l"
              - "user"
              - "-p"
              - "$(AIRFLOW_ADMIN_PASSWORD)"
          config:
            core:
              xcom_backend: airflow.providers.common.io.xcom.backend.XComObjectStorageBackend
            logging:
              remote_logging: "True"
              remote_base_log_folder: {{ printf "s3://%s/airflow/logs" $.Values.global.airflowLogsBucket | quote }}
              remote_log_conn_id: aws_default
            common.io:
              xcom_objectstorage_path: {{ printf "s3://aws_default@%s/airflow/xcom" $.Values.global.airflowLogsBucket | quote }}
              xcom_objectstorage_threshold: "1048576"
              xcom_objectstorage_compression: gzip
{{ else if eq $app.name "kubecost" }}
        kubecost:
          global:
            clusterId: {{ $.Values.global.clusterName | quote }}
          cloudCost:
            serviceAccountName: kubecost-aws
            cloudIntegrationJSON: {{ dict "aws" (dict "athena" (list (dict "bucket" (printf "s3://%s" $.Values.global.kubecostAthenaQueryResultsBucket) "region" $.Values.global.awsRegion "database" $.Values.global.kubecostAthenaDatabase "table" $.Values.global.kubecostAthenaTable "workgroup" $.Values.global.kubecostAthenaWorkgroup "account" $.Values.global.kubecostAthenaAccountId))) | toJson | quote }}
{{ end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $app.namespace | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      {{- if has $app.name (list "spark-operator" "cloudnative-pg") }}
      - ServerSideApply=true
      {{- end }}
{{- end }}
